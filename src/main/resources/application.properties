spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Release the DB connection when the service/transaction ends, not at end of HTTP request
spring.jpa.open-in-view=false

# HikariCP connection pool tuning (keep max BELOW Supabase's 15-connection limit)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# Log a stack trace for any connection held longer than 20s (finds leaks)
spring.datasource.hikari.leak-detection-threshold=20000
jwt.secret=ContraFlowCmsJwtSecretKey2026SecureAuthentication123
# access token lifetime (ms)  — 1 day
jwt.expiration=86400000
# refresh token lifetime (ms) — 30 days
jwt.refresh-expiration=2592000000
aws.bucket-name=contraflow-cms
spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.password=${REDISPASSWORD:}
# Fail fast if Redis is unreachable so the CacheErrorHandler can fall back quickly
spring.data.redis.timeout=2000
spring.data.redis.connect-timeout=2000
spring.cache.type=redis

## Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# don't bake Java type headers into the message -> consumer can read any payload generically
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# deserialize every email payload as a generic map (works for all email types on one topic)
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.LinkedHashMap
spring.kafka.consumer.group-id=email-service
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
# manual commit + one listener thread per partition (3 partitions)
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3

