#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Release the DB connection when the service/transaction ends, not at end of HTTP request
spring.jpa.open-in-view=false

# HikariCP connection pool tuning (keep max BELOW Supabase's 15-connection limit)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# Log a stack trace for any connection held longer than 20s (finds leaks)
spring.datasource.hikari.leak-detection-threshold=20000
