<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="layout(heading, content)"
      style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e6e8eb;">
        <tr><td style="background:#1f2937;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:bold;">
          ContraFlow CMS
        </td></tr>
        <tr><td style="padding:28px;color:#111827;font-size:15px;line-height:1.6;">
          <h2 style="margin:0 0 16px;font-size:20px;color:#111827;" th:text="${heading}">Heading</h2>
          <th:block th:replace="${content}">content</th:block>
          <p style="margin-top:24px;color:#6b7280;">Thanks,<br/>The ContraFlow CMS Team</p>
        </td></tr>
        <tr><td style="background:#f9fafb;padding:16px 28px;color:#9ca3af;font-size:12px;">
          This is an automated message — please do not reply.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
